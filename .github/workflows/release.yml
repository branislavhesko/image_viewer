name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: image_viewer
            asset_name: image_viewer-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: image_viewer.exe
            asset_name: image_viewer-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: image_viewer
            asset_name: ImageViewer-macos-arm64.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create macOS app bundle
        if: matrix.os == 'macos-latest'
        run: |
          # Create app bundle structure
          mkdir -p ${{ matrix.asset_name }}/Contents/MacOS
          mkdir -p ${{ matrix.asset_name }}/Contents/Resources

          # Copy binary
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}/Contents/MacOS/

          # Copy icon if it exists
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png ${{ matrix.asset_name }}/Contents/Resources/
          fi

          # Create Info.plist
          cat > ${{ matrix.asset_name }}/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>image_viewer</string>
              <key>CFBundleIconFile</key>
              <string>icon.png</string>
              <key>CFBundleIdentifier</key>
              <string>com.imageviewer.app</string>
              <key>CFBundleName</key>
              <string>Image Viewer</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundleVersion</key>
              <string>${{ github.ref_name }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key>
                      <string>Image</string>
                      <key>CFBundleTypeRole</key>
                      <string>Viewer</string>
                      <key>LSHandlerRank</key>
                      <string>Alternate</string>
                      <key>LSItemContentTypes</key>
                      <array>
                          <string>public.image</string>
                          <string>public.png</string>
                          <string>public.jpeg</string>
                          <string>public.tiff</string>
                          <string>com.compuserve.gif</string>
                      </array>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # Make binary executable
          chmod +x ${{ matrix.asset_name }}/Contents/MacOS/image_viewer

          # Create zip archive for distribution
          zip -r ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

      - name: Prepare artifact
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
            chmod +x ${{ matrix.asset_name }}
          fi

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

      - name: Upload artifact (non-macOS)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/image_viewer-linux-x86_64/image_viewer-linux-x86_64
            ./artifacts/image_viewer-windows-x86_64.exe/image_viewer-windows-x86_64.exe
            ./artifacts/ImageViewer-macos-arm64.app/ImageViewer-macos-arm64.app.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Downloads

            - **Linux (x86_64)**: `image_viewer-linux-x86_64`
            - **Windows (x86_64)**: `image_viewer-windows-x86_64.exe`
            - **macOS (Apple Silicon/ARM64)**: `ImageViewer-macos-arm64.app.zip`

            ### macOS Installation
            1. Download and unzip `ImageViewer-macos-arm64.app.zip`
            2. Move `ImageViewer-macos-arm64.app` to your Applications folder
            3. Right-click and select "Open" the first time to bypass Gatekeeper

            ### Features
            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full feature list.